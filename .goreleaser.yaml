version: 2

project_name: safecat

before:
  hooks:
    - go test ./...

builds:
  - id: safecat
    main: ./cmd/safecat
    binary: safecat
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - "-s -w -X github.com/luxolo/safecat.Version={{.Version}}"

archives:
  - formats:
      - tar.gz
    files:
      - README.md
      - LICENSE

checksum:
  name_template: checksums.txt

release:
  replace_existing_artifacts: true

nfpms:
  - id: safecat
    package_name: safecat
    vendor: luxolo
    homepage: https://github.com/luxolo/safecat
    maintainer: luxolo
    description: Streaming Unix filter for redacting secrets from text
    license: Apache-2.0
    formats:
      - deb
      - rpm
    bindir: /usr/bin

# Publish a formula that downloads the release archives instead of building
# safecat from source. HOMEBREW_TAP_TOKEN is supplied by the release workflow.
brews:
  - name: safecat
    ids:
      - safecat
    repository:
      owner: luxolo
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Formula
    homepage: https://github.com/luxolo/safecat
    description: Streaming Unix filter for redacting secrets from text
    license: Apache-2.0
    install: |
      bin.install "safecat"
    test: |
      assert_equal "safecat #{version}", shell_output("#{bin}/safecat --version").strip
